<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="32" height="32" fill="none"/>

  <!-- Hair (long, both sides) -->
  <g fill="#e2c36b">
    <rect x="6" y="3" width="20" height="10"/>
    <rect x="6" y="3" width="4" height="22"/>
    <rect x="22" y="3" width="4" height="22"/>
  </g>

  <!-- Face -->
  <rect x="9" y="6" width="14" height="16" fill="#f2c9a5"/>

  <!-- Eyes (large cartoon style) -->
  <g fill="#ffffff">
    <rect x="11" y="10" width="4" height="4"/>
    <rect x="17" y="10" width="4" height="4"/>
  </g>
  <g fill="#2b3a42">
    <rect x="12" y="11" width="2" height="2"/>
    <rect x="18" y="11" width="2" height="2"/>
  </g>

  <!-- Glasses (red round frames simplified) -->
  <g fill="#d94b4b">
    <!-- Left frame -->
    <rect x="10" y="9" width="6" height="1"/>
    <rect x="10" y="13" width="6" height="1"/>
    <rect x="10" y="10" width="1" height="3"/>
    <rect x="15" y="10" width="1" height="3"/>

    <!-- Right frame -->
    <rect x="16" y="9" width="6" height="1"/>
    <rect x="16" y="13" width="6" height="1"/>
    <rect x="16" y="10" width="1" height="3"/>
    <rect x="21" y="10" width="1" height="3"/>

    <!-- Bridge -->
    <rect x="15" y="11" width="2" height="1"/>
  </g>

  <!-- Brows -->
  <g fill="#8a6b3f">
    <rect x="11" y="8" width="4" height="1"/>
    <rect x="17" y="8" width="4" height="1"/>
  </g>

  <!-- Smile (open mouth cartoon style) -->
  <g fill="#3a1f1f">
    <rect x="11" y="16" width="10" height="3"/>
  </g>
  <rect x="12" y="16" width="8" height="1" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="13" y="22" width="6" height="3" fill="#f2c9a5"/>

  <!-- Shirt -->
  <rect x="10" y="25" width="12" height="5" fill="#c9a227"/>
</svg>