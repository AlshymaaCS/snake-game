<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Background (transparent) -->
  <rect width="32" height="32" fill="none"/>

  <!-- Skin tone -->
  <g fill="#d9a074">
    <rect x="8" y="4" width="16" height="20"/>
    <rect x="10" y="2" width="12" height="2"/>
  </g>

  <!-- Head shading -->
  <rect x="23" y="4" width="1" height="20" fill="#b67f58"/>

  <!-- Glasses -->
  <g fill="#444">
    <!-- Left frame -->
    <rect x="10" y="10" width="4" height="1"/>
    <rect x="10" y="11" width="1" height="2"/>
    <rect x="13" y="11" width="1" height="2"/>

    <!-- Right frame -->
    <rect x="18" y="10" width="4" height="1"/>
    <rect x="18" y="11" width="1" height="2"/>
    <rect x="21" y="11" width="1" height="2"/>

    <!-- Bridge -->
    <rect x="14" y="11" width="4" height="1"/>
  </g>

  <!-- Eyes -->
  <g fill="#222">
    <rect x="11" y="11" width="2" height="1"/>
    <rect x="19" y="11" width="2" height="1"/>
  </g>

  <!-- Smile -->
  <g fill="#ffffff">
    <rect x="12" y="16" width="8" height="2"/>
  </g>
  <g fill="#7a3e2e">
    <rect x="11" y="15" width="10" height="1"/>
    <rect x="11" y="18" width="10" height="1"/>
  </g>

  <!-- Neck -->
  <rect x="13" y="24" width="6" height="3" fill="#d9a074"/>

  <!-- Shirt (simplified checkered hint) -->
  <g fill="#2f4a60">
    <rect x="10" y="27" width="12" height="5"/>
  </g>
  <g fill="#ffffff" opacity="0.5">
    <rect x="10" y="27" width="1" height="5"/>
    <rect x="14" y="27" width="1" height="5"/>
    <rect x="18" y="27" width="1" height="5"/>
  </g>
</svg>