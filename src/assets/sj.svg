<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="32" height="32" fill="none"/>

  <!-- Head -->
  <g fill="#d8a07a">
    <rect x="8" y="5" width="16" height="18"/>
  </g>

  <!-- Hair (top + sides) -->
  <g fill="#6b4a2f">
    <rect x="9" y="3" width="14" height="3"/>
    <rect x="8" y="5" width="2" height="6"/>
    <rect x="22" y="5" width="2" height="6"/>
  </g>

  <!-- Beard -->
  <g fill="#5a3d28">
    <rect x="9" y="16" width="14" height="5"/>
    <rect x="10" y="20" width="12" height="2"/>
  </g>

  <!-- Eyes -->
  <g fill="#222">
    <rect x="11" y="11" width="2" height="1"/>
    <rect x="19" y="11" width="2" height="1"/>
  </g>

  <!-- Eyebrows -->
  <g fill="#5a3d28">
    <rect x="11" y="10" width="2" height="1"/>
    <rect x="19" y="10" width="2" height="1"/>
  </g>

  <!-- Nose -->
  <rect x="15" y="12" width="2" height="2" fill="#c58c66"/>

  <!-- Smile (teeth + outline) -->
  <g fill="#ffffff">
    <rect x="12" y="15" width="8" height="2"/>
  </g>
  <g fill="#7a3e2e">
    <rect x="11" y="14" width="10" height="1"/>
    <rect x="11" y="17" width="10" height="1"/>
  </g>

  <!-- Neck -->
  <rect x="13" y="23" width="6" height="3" fill="#d8a07a"/>

  <!-- Shirt -->
  <rect x="10" y="26" width="12" height="6" fill="#e6e1dc"/>
</svg>